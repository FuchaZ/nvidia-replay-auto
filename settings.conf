# ============================================================================
#  NvidiaInstantReplayAuto 运行参数
#
#  本文件是运行参数的唯一来源：主程序、游戏清单工具、诊断工具、安装器
#  都读它，因此「安装时打印的清单」和「运行时真正监控的集合」永远一致。
#
#  改完保存后，重新双击「点此一键安装.bat」即可生效。
#  值只有 true / false（大小写不敏感）；某行删掉或留空则用括号里的默认值。
# ============================================================================

# 是否扫描各盘符的常见游戏目录（Games / 游戏 / WeGameApps 等），
# 用来识别「不是从 Steam / WeGame 安装」的独立游戏，例如官网直接下载的
# 《三角洲行动》、解压即玩的游戏。内置黑名单会排除 TeamSpeak、Discord、
# OBS 等工具类程序。
#   true  = 纳入独立游戏（默认）
#   false = 只认 Steam / WeGame / Epic 登记的游戏
ScanStandalone = true

# 是否纳入 Epic 游戏（读取 Epic 的安装清单）。
#   false = 不纳入（默认）
#   true  = 纳入
IncludeEpic = false

# 进程扫描间隔（秒）。越小越灵敏；每次扫描约 60ms，别设太小。
#   默认 3
PollSeconds = 3

# 游戏全部退出后，是否自动关闭即时回放。
# 只关闭「由本工具开启的」回放；你手动开的回放不受影响。
#   true  = 退出即关（默认）
#   false = 保持开启
AutoDisableOnExit = true
